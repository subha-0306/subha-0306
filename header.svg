<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Subhalakshmi M — Full-Stack Developer and AI Product Builder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d18"/>
      <stop offset="1" stop-color="#1a1236"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1280" height="380" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1280" height="380" fill="url(#bg)"/>
    <rect width="1280" height="380" fill="url(#grid)"/>

    <!-- drifting light orbs -->
    <circle cx="260" cy="120" r="260" fill="url(#orbA)">
      <animate attributeName="cx" values="260;420;260" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="120;200;120" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="280" r="280" fill="url(#orbB)">
      <animate attributeName="cx" values="1020;860;1020" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="280;170;280" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="60" r="200" fill="url(#orbC)">
      <animate attributeName="cx" values="700;820;700" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;130;60" dur="13s" repeatCount="indefinite"/>
    </circle>

    <!-- self-drawing data line -->
    <path id="spark" d="M700 330 L760 318 L820 326 L880 292 L940 300 L1000 250 L1060 268 L1120 208 L1180 224 L1240 150 L1280 164"
          fill="none" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="900" stroke-dashoffset="900" opacity="0.9">
      <animate attributeName="stroke-dashoffset" values="900;0;0;900" keyTimes="0;0.45;0.85;1" dur="9s" repeatCount="indefinite"/>
    </path>
    <circle r="5" fill="#f9a8d4">
      <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1;1;0" keyTimes="0;0.45;0.85;1" calcMode="linear">
        <mpath href="#spark"/>
      </animateMotion>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- label -->
    <text x="80" y="92" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" letter-spacing="5" fill="#c4b5fd">
      FULL-STACK  ·  AI  ·  PRODUCT
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <rect x="80" y="104" width="64" height="3" rx="1.5" fill="url(#line)">
      <animate attributeName="width" values="0;64;64;180;64" keyTimes="0;0.1;0.5;0.7;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- name -->
    <text x="76" y="196" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="82" font-weight="700" fill="url(#name)">
      Subhalakshmi M
      <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
    </text>

    <!-- rotating roles -->
    <g font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-style="italic" font-size="34" fill="#e9d5ff">
      <text x="80" y="262" opacity="0">Full-Stack Developer.
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.30;0.38;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="262" opacity="0">AI &amp; Product Builder.
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.30;0.38;1" dur="9s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="262" opacity="0">Explainable systems, shipped.
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.30;0.38;1" dur="9s" begin="6s" repeatCount="indefinite"/>
      </text>
    </g>

    <text x="80" y="322" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" letter-spacing="2" fill="#8b86a8">
      Rajalakshmi Engineering College  ·  Chennai, India
    </text>
  </g>
</svg>
