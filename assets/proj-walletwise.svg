<svg xmlns="http://www.w3.org/2000/svg" width="880" height="128" viewBox="0 0 880 128" role="img" aria-label="WalletWise — Personal finance, in under 10 seconds" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b110d"/><stop offset="1" stop-color="#472a17"/></linearGradient>
<radialGradient id="orb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e8a96f" stop-opacity="0.55"/><stop offset="1" stop-color="#e8a96f" stop-opacity="0"/></radialGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8a96f"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity="0.07"/></pattern>
<clipPath id="cp"><rect width="880" height="128" rx="18"/></clipPath>
</defs>
<g clip-path="url(#cp)">
<rect width="880" height="128" fill="url(#bg)"/><rect width="880" height="128" fill="url(#dots)"/>
<circle cx="740" cy="90" r="170" fill="url(#orb)"><animate attributeName="cx" values="740;670;740" dur="9s" repeatCount="indefinite"/></circle>
<text x="856" y="124" text-anchor="end" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-weight="700" font-size="92" fill="none" stroke="#e8a96f" stroke-opacity="0.30" stroke-width="2">02</text>
<rect width="6" height="128" fill="url(#bar)"/>
<text x="38" y="38" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="3" fill="#e8a96f">FULL-STACK  /  PWA</text>
<text x="38" y="82" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-weight="700" font-size="36" fill="#ffffff">WalletWise</text>
<text x="38" y="107" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-style="italic" font-size="16" fill="#f59e0b">Personal finance, in under 10 seconds</text>
<rect x="710" y="22" width="146" height="26" rx="13" fill="#000" fill-opacity="0.35" stroke="#34d399" stroke-opacity="0.6"/>
<circle cx="726" cy="35" r="4" fill="#34d399"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="738" y="39.5" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" letter-spacing="2" fill="#f4f0ff">LIVE  DEPLOYED</text>
<rect x="-300" y="0" width="240" height="128" fill="url(#shine)" transform="skewX(-20)"><animate attributeName="x" values="-300;1000" dur="6s" begin="1.6s" repeatCount="indefinite"/></rect>
</g>
<rect x="0.75" y="0.75" width="878.5" height="126.5" rx="18" fill="none" stroke="#e8a96f" stroke-opacity="0.45" stroke-width="1.5"/>
</svg>